<div class="container">
    <h2 class="mb-4">Listado de usuarios</h2>
    <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let user of users">
            <div class="card h-100 text-center shadow-sm">
                <img [src]="user.image" class="card-img-top p-3" style="height: 200px; object-fit: cover;"
                    [alt]="user.first_name">
                <div class="card-body">
                    <h5 class="card-title">{{ user.first_name }} {{ user.last_name }}</h5>
                    <div class="d-flex flex-column gap-2 mt-3">
                        <button class="btn btn-outline-primary btn-sm" (click)="moreDetail(user._id!)">Ver
                            detalle</button>
                        <button class="btn btn-outline-secondary btn-sm"
                            (click)="uploadUserFunction(user._id!)">Actualizar</button>
                        <button class="btn btn-outline-danger btn-sm"
                            (click)="deleteUserFunction(user._id!, user.first_name)">Borrar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
